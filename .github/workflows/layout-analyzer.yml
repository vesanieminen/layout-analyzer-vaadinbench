name: layout-analyzer

on:
  pull_request:
    paths:
      - 'vaadin-layout-analyzer-preview-*.tgz'
      - 'vaadin-bench.py'
      - 'scripts/layout-analyzer/**'
      - 'scripts/layout_analyzer.py'
      - 'scripts/test-layout-analyzer.py'
      - 'tasks/flow-employee-list-strict/**'
      - 'tasks/*/tests/protected/**'
      - 'base/**'
      - '.github/scripts/*image*.sh'
      - 'uv.lock'
      - '.github/workflows/layout-analyzer.yml'
  workflow_dispatch:

concurrency:
  group: layout-analyzer-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Real Copilot layout capture
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Prepare the current modern stack
        run: |
          set -euo pipefail
          source .github/scripts/task-images.sh
          base_ref=$(task_image_reference modern tests)
          revision=$(bash .github/scripts/base-image-revision.sh "$base_ref")
          decision=$(bash .github/scripts/base-image-decision.sh "${{ github.event_name }}" "$revision" modern)
          agents_ref=$(task_image_reference modern environment)
          revision=$(bash .github/scripts/base-image-revision.sh "$agents_ref")
          agents=$(bash .github/scripts/agents-image-decision.sh "${{ github.event_name }}" "$revision" modern "$decision")
          if [ "$decision" = rebuild ]; then
            base_ref=vaadinbench-base:layout-ci
            docker build -t "$base_ref" -f base/Dockerfile .
          fi
          if [ "$agents" = rebuild ]; then
            agents_ref=vaadinbench-agents:layout-ci
            docker build -t "$agents_ref" --build-arg BASE_IMAGE="$base_ref" -f base/agents.Dockerfile .
          fi
          pin_task_images "$base_ref" "$agents_ref" "" ""
      - name: Stage and build the employee-list experiment
        run: |
          task=$(PYTHONPATH=scripts uv run python - <<'PY'
          from layout_analyzer import stage_tasks
          print(stage_tasks(['flow-employee-list-strict'], 'full') / 'flow-employee-list-strict')
          PY
          )
          docker build -t layout-analyzer-smoke "$task/environment"
      - name: Exercise the preview against real Vaadin, offline
        run: |
          mkdir -p layout-smoke
          docker run --rm --network none --cpus 2 --memory 4g \
            -v "$PWD/tasks/flow-employee-list-strict/solution:/reference:ro" \
            -v "$PWD/layout-smoke:/logs/agent" \
            layout-analyzer-smoke bash -lc '
              set -euo pipefail
              bash /reference/solve.sh
              app-start
              node /opt/vaadinbench/layout-analyzer/smoke.mjs
              layout-check http://localhost:8080/employees --ready vaadin-grid --out /logs/agent/adapter
              app-stop
              JAVA_TOOL_OPTIONS=-Dvaadin.copilot.enable=false app-start
              if layout-check http://localhost:8080/employees --ready vaadin-grid --timeout 2000 --out /logs/agent/disabled; then
                echo "Capture unexpectedly succeeded without Copilot" >&2
                exit 1
              fi
              node -e '\''const r=require("/logs/agent/disabled/capture.json"); if(r.status!=="error" || r.copilotAvailable!==false) process.exit(1)'\''
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-analyzer-smoke
          path: layout-smoke
